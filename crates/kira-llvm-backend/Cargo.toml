[package]
name = "kira-llvm-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kira-ir.workspace = true
kira-backend-api.workspace = true
kira-runtime-abi.workspace = true
kira-semantics-model.workspace = true
kira-toolchain.workspace = true
thiserror.workspace = true
# A hard dependency by decision: every kirac carries the LLVM backend, and a
# machine without a managed LLVM does not build this workspace. Point the
# build at one with:
#   LLVM_SYS_221_PREFIX=~/.kira/toolchains/llvm/<version>/<host>
# CI provisions the same bundle before building.
llvm-sys = { workspace = true }

[lints]
workspace = true
