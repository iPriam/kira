[package]
name = "kira-llvm-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kira-ir.workspace = true
kira-backend-api.workspace = true
# The link line is built from the resolved native-library inputs — archives
# plus the frameworks, system libraries, and flags declared beside them.
kira-native-lib-definition.workspace = true
kira-diagnostics.workspace = true
kira-runtime-abi.workspace = true
kira-semantics-model.workspace = true
kira-toolchain.workspace = true
thiserror.workspace = true
# A hard dependency by decision: every kira carries the LLVM backend, and a
# machine without a managed LLVM does not build this workspace. The two
# features turn off llvm-sys's own environment-driven LLVM search entirely —
# it compiles as pure declarations — and this crate's build script links the
# managed bundle instead, discovered through kira-toolchain (KIRA_LLVM_HOME
# overrides; CI provisions the same bundle before building).
llvm-sys = { workspace = true, features = ["no-llvm-linking", "disable-alltargets-init"] }

[build-dependencies]
kira-toolchain.workspace = true

[dev-dependencies]
# Building HIR fixtures for the foreign-adapter compile-link-run test needs the
# span type the HIR carries; the frontend crates that normally supply it are
# above this layer, so it is a test-only dependency here.
kira-source.workspace = true

[lints]
workspace = true
