[package]
name = "kira-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "kira"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kira-debug.workspace = true
kira-toolchain.workspace = true
kira-app-generation.workspace = true
kira-export.workspace = true
kira-source.workspace = true
kira-diagnostics.workspace = true
kira-lexer.workspace = true
kira-parser.workspace = true
kira-program-graph.workspace = true
kira-semantics.workspace = true
kira-ir.workspace = true
kira-semantics-model.workspace = true
kira-bytecode.workspace = true
# The build system: the frontend query and the library/wrapper-crate build both
# live there, so `kira` drives them rather than owning a second copy.
kira-build.workspace = true
kira-profile.workspace = true
kira-linter.workspace = true
kira-doc.workspace = true
kira-main.workspace = true
kira-dynamic-ffi.workspace = true
kira-vm-runtime.workspace = true
kira-runtime-abi.workspace = true
kira-backend-api.workspace = true
kira-llvm-backend.workspace = true
kira-hybrid-definition.workspace = true
kira-hybrid-runtime.workspace = true
kira-libffi.workspace = true
kira-live.workspace = true
kira-manifest.workspace = true
kira-package-manager.workspace = true
# Manifest discovery: `kira` walks up from the source file to the package that
# governs it, which is what makes `kind = .Library` reach the frontend.
kira-project.workspace = true
# Structured target triples and the resolved-library catalog: `kira` picks the
# build target and resolves each `@FFI.Extern` import's archive against it.
kira-native-lib-definition.workspace = true
# Not called from Rust: depending on the native runtime makes cargo build its
# staticlib. `native::runtime_archive` accepts both the un-hashed profile path
# and Cargo's hashed `profile/deps` path for package-only CLI builds.
kira-native-bridge.workspace = true
# The compiler capability, from both ends. `kira-check` is what `kira` grants a
# running program; `kira-compiler-bridge` is not called from Rust at all —
# depending on it makes cargo build its staticlib, and the same archive lookup
# handles both the workspace and package-only layouts.
kira-check.workspace = true
kira-compiler-bridge.workspace = true
# Not called from Rust: `kira live` starts the desktop runner as a child
# process. This dep only orders the build and ties the versions together — cargo
# builds a dependency's lib target, never its `[[bin]]`, so unlike the staticlib
# above this does NOT put `kira-desktop-runner` beside `kira`. Only a workspace
# build does that, which is why a live session that cannot find its runner says
# so and names the build that would fix it.
kira-desktop-runner.workspace = true
salsa.workspace = true
# `kira debug --prepare` answers a debugger frontend in JSON, in the same
# contract `kira-debug` defines and the frontend deserializes.
serde_json.workspace = true
# Not called from Rust: `kira build --backend hybrid` stages the launcher
# binary as the program's executable. This dep only orders the build and ties
# the versions together — cargo builds a dependency's lib target, never its
# `[[bin]]`, so this does NOT put `kira-hybrid-launcher` beside `kira`. Only a
# workspace build does that, which is why a build that cannot find its launcher
# says so and names the build that would fix it.
kira-hybrid-launcher.workspace = true
thiserror.workspace = true

# The build-directory lock is the operating system's, so that a killed build
# releases it and a live one can never have it taken away. Each platform has one
# call for that and no portable name for either.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Test-only upward reference (cargo's one legal cycle): the end-to-end proof
# that a knvm-installed toolchain resolves its own Foundation has to install
# with the real installer, not with a tree the test hand-shaped to match.
kira-knvm.workspace = true
# The FFI proofs compile the C fixture into a static archive with the managed
# clang and llvm-ar, so the test needs no checked-in binary and no system
# headers.
kira-toolchain.workspace = true
