[package]
name = "kira-lsp"
description = "Kira language server (LSP) over the salsa frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kira-language-server"
path = "src/main.rs"

[dependencies]
# The server runs the compiler's own frontend rather than a second one: an
# editor squiggle and a `kira check` error must be the same computation.
kira-program-graph.workspace = true
kira-semantics.workspace = true
kira-diagnostics.workspace = true
kira-source.workspace = true
salsa.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
