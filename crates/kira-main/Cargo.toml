[package]
name = "kira-main"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `rlib` only, because the only consumer this crate names is Rust.
#
# It carried `staticlib` and `cdylib` too, for a C facade that does not exist
# yet — and paid for them: `kira-export-consumer` depends on this crate
# normally *and*, through `kira-build`, as a build dependency, so cargo builds
# it twice in one graph. It disambiguates the two rlibs with a metadata hash,
# but a `staticlib`/`cdylib` artifact is named for external tooling to find, so
# both units wrote `libkira_main.a`/`.dylib`/`.rlib` to the same paths and
# raced. `cargo build --release --workspace` failed two runs out of three on a
# stale-artifact error, which is a compiler nobody can measure against.
#
# Adding them back is this line when a non-Rust consumer appears — the same
# terms the C entry points are held to in `lib.rs`.
crate-type = ["rlib"]

[dependencies]
kira-bytecode.workspace = true
kira-runtime-abi.workspace = true
kira-vm-runtime.workspace = true
thiserror.workspace = true

# Dynamic loading of a generated foreign-adapter sidecar is native-only: it
# `dlopen`s a shared library, which wasm has no notion of. Target-gated so the
# embedding surface still builds for `wasm32-unknown-unknown` (a Rust app that
# embeds a Kira library and is itself compiled to wasm needs no foreign host).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
kira-dynamic-ffi.workspace = true
kira-libffi.workspace = true

[lints]
workspace = true
