[package]
name = "kira-main"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
kira-bytecode.workspace = true
kira-runtime-abi.workspace = true
kira-vm-runtime.workspace = true
thiserror.workspace = true

# Dynamic loading of a generated foreign-adapter sidecar is native-only: it
# `dlopen`s a shared library, which wasm has no notion of. Target-gated so the
# embedding surface still builds for `wasm32-unknown-unknown` (a Rust app that
# embeds a Kira library and is itself compiled to wasm needs no foreign host).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
kira-dynamic-ffi.workspace = true

[lints]
workspace = true
