[package]
name = "kira-export-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Nothing depends on this crate: it exists to be built and tested.
publish = false

[lib]
# Named for what it is rather than for the crate, because the crate's whole
# content is the generated library plus the tests that call it.
path = "src/lib.rs"

[features]
# Build and link the library as **native machine code** instead of running it on
# the VM. Off by default: the default configuration is the VM engine, and this
# flips `build.rs` to drive the LLVM backend — always compiled in now — so the
# native engine is `--features native-engine`.
native-engine = []
# Build and link the library for the **hybrid engine**: the bytecode half runs
# on the VM in this process, the `@Native` half is a shared library this process
# opens at load. Off by default for the same reason `native-engine` is; the
# hybrid engine is `--features hybrid-engine`.
#
# Mutually exclusive with `native-engine` in practice: both replace the same
# generated wrapper, and `build.rs` refuses the pair by name rather than letting
# cargo's feature unification silently pick one.
#
# It also brings in `kira-hybrid-main`, and *only* it does: that crate loads code
# dynamically, so it does not build for `wasm32-unknown-unknown`. Depending on it
# unconditionally would break the wasm check of the default configuration, which
# is this feature's whole wasm answer — a Rust wasm program embeds the **VM**
# engine's crate, and that must keep compiling.
hybrid-engine = ["dep:kira-hybrid-main"]

[build-dependencies]
# The compiler itself. A consumer builds the Kira library it embeds, through the
# same frontend and the same generator `kirac` drives — not a second copy.
kira-build.workspace = true
kira-ir.workspace = true
thiserror.workspace = true

[dependencies]
# What the generated wrapper is written against. These are the lines a real
# consumer's `Cargo.toml` carries, and they are here for the same reason. The VM
# engine's crate uses all three; the native engine's uses the last two.
kira-bytecode.workspace = true
kira-main.workspace = true
kira-runtime-abi.workspace = true
# The hybrid engine only, and optional for the reason that feature states: it
# dynamically loads code and so has no `wasm32-unknown-unknown` build.
kira-hybrid-main = { workspace = true, optional = true }

[lints]
workspace = true
