name: Release

# Pushing a `v*` tag publishes a GitHub release with, per platform:
#
#   kira-<version>-<host-key>.tar.gz   the toolchain: bin/kira +
#                                      bin/kira-language-server +
#                                      bin/kira-desktop-runner + foundation/
#   knvm-<version>-<host-key>.tar.gz   the tools: bin/knvm + bin/kira +
#                                      bin/kira-language-server (launcher alias)
#   <archive>.sha256                   the digest each archive is verified
#                                      against, by knvm and by the bootstrap
#
# The toolchain archive's name and layout are knvm's install contract
# (`archive_file_name`, `select_asset`, `validate` in kira-knvm); the tools
# archive is the one manual download — unpack it, put it on PATH, and
# `knvm install latest` provisions everything else. A `-dev` tag publishes as
# a GitHub prerelease, which knvm reads as the `dev` channel.
#
# Nothing is uploaded until the same job has installed from the just-packed
# archive with the just-built knvm and run the installed compiler. A tag that
# would publish a broken toolchain fails here instead.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: build + verify + package (${{ matrix.host_key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host_key: x86_64-linux-gnu
          - os: macos-latest
            host_key: aarch64-macos
          - os: windows-latest
            host_key: x86_64-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A version may carry a fourth component — `1.8.0.1`, the second release
      # of one week — which Cargo's version field cannot hold. The tag is the
      # full string, and KIRA_RELEASE_VERSION carries it into the build so the
      # binaries report the release rather than the Cargo prefix they compiled
      # under.
      - name: Resolve the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "KIRA_VERSION=$version" >> "$GITHUB_ENV"
          echo "KIRA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # The tag names the release; Cargo.toml must agree on the part it can
      # express, or the archive and the compiler inside it claim different
      # versions.
      - name: Check the tag against the workspace version
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A prerelease tag carries a suffix the version it extends does not:
          # `v1.8.0-dev1` releases 1.8.0's line as a prerelease, and the header
          # above promises exactly that. Compare the part before the suffix, or
          # the check contradicts the contract this file documents and no
          # `-dev` tag can ever publish.
          base="${KIRA_VERSION%%-*}"
          case "$base" in
            "$cargo_version" | "$cargo_version".*) ;;
            *)
              echo "tag $KIRA_VERSION does not extend Cargo.toml $cargo_version" >&2
              exit 1
              ;;
          esac

      # The LLVM backend is a hard dependency of kira; the managed bundle is
      # published by the llvm-bundles workflow, once per pin.
      - name: Provision the managed LLVM
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' llvm-metadata.toml | head -1)"
          release="$(sed -n 's/^release_tag = "\(.*\)"/\1/p' llvm-metadata.toml | head -1)"
          asset="$(sed -n "/^\[target.${{ matrix.host_key }}\]/,/^\[/s/^asset = \"\(.*\)\"/\1/p" llvm-metadata.toml | head -1)"
          # The metadata declares the format per target — `zip` for Windows,
          # `tar.xz` elsewhere — and this is what reads it. Unpacking every
          # bundle with `tar` answered "This does not look like a tar archive"
          # on Windows, so no Windows release could ever be published; knvm's
          # own unpacker (kira-knvm/src/llvm.rs) has always made this split.
          format="$(sed -n "/^\[target.${{ matrix.host_key }}\]/,/^\[/s/^archive = \"\(.*\)\"/\1/p" llvm-metadata.toml | head -1)"
          home="$HOME/.kira/toolchains/llvm/$version/${{ matrix.host_key }}"
          mkdir -p "$home"
          gh release download "$release" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --output "bundle-$asset"
          case "$format" in
            zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "bundle-$asset" -d "$home"
              else
                7z x -y -o"$home" "bundle-$asset" >/dev/null
              fi
              ;;
            *) tar -xf "bundle-$asset" -C "$home" ;;
          esac
          rm "bundle-$asset"
          # Named for every later step. Discovery looks under `$KIRA_HOME`, and
          # the verification below points that at a scratch directory so it can
          # install the packed archive into a clean home — which left the
          # compiler unable to find the LLVM this step just provisioned.
          echo "KIRA_LLVM_HOME=$home" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the release binaries
        run: |
          rustup target add wasm32-unknown-emscripten
          cargo build --release -p kira-cli -p kira-lsp -p kira-knvm -p kira-launcher \
            -p kira-desktop-runner -p kira-native-bridge -p kira-compiler-bridge
          cargo build --release -p kira-native-bridge --target wasm32-unknown-emscripten

      - name: Package the toolchain and tools archives
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi

          stage="stage/kira-$KIRA_VERSION"
          mkdir -p "$stage/bin"
          cp "target/release/kira$exe" "$stage/bin/"
          # The language server ships with its compiler so the two cannot
          # drift; knvm's validate refuses an archive without it.
          cp "target/release/kira-language-server$exe" "$stage/bin/"
          # `kira live` starts the runner client from beside itself, so it
          # ships with the compiler rather than being fetched or built later.
          cp "target/release/kira-desktop-runner$exe" "$stage/bin/"
          # The runtime archives ride beside the compiler, where its archive
          # resolution looks; compiler-using programs select the compiler
          # bridge, and the Web one is target-suffixed.
          # `<base>.lib` under MSVC and `lib<base>.a` everywhere else — the
          # split `static_archive_name` makes in kira-toolchain, which is the
          # name knvm looks for and the name the compiler resolves beside
          # itself. Naming only the Unix one meant the Windows archive would
          # have shipped without either bridge, had it ever got this far.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/kira_native_bridge.lib "$stage/bin/"
            cp target/release/kira_compiler_bridge.lib "$stage/bin/"
          else
            cp target/release/libkira_native_bridge.a "$stage/bin/"
            cp target/release/libkira_compiler_bridge.a "$stage/bin/"
          fi
          cp target/wasm32-unknown-emscripten/release/libkira_native_bridge.a \
             "$stage/bin/libkira_native_bridge-wasm32-emscripten.a"
          cp -R foundation "$stage/foundation"
          mkdir -p dist
          tar -czf "dist/kira-$KIRA_VERSION-${{ matrix.host_key }}.tar.gz" -C stage "kira-$KIRA_VERSION"

          tools="stage/knvm-$KIRA_VERSION"
          mkdir -p "$tools/bin"
          cp "target/release/knvm$exe" "$tools/bin/"
          # The launcher, installed under the name a user types. It is built as
          # `kira-launcher` because the compiler CLI is the workspace's `kira`,
          # and one cargo workspace cannot build two binaries of one name; what
          # goes on PATH is this, and it execs the selected toolchain's `kira`.
          cp "target/release/kira-launcher$exe" "$tools/bin/kira$exe"
          # The launcher under its language-server name: PATH resolves this
          # copy, and it dispatches to the selected toolchain's real server.
          cp "target/release/kira-launcher$exe" "$tools/bin/kira-language-server$exe"
          tar -czf "dist/knvm-$KIRA_VERSION-${{ matrix.host_key }}.tar.gz" -C stage "knvm-$KIRA_VERSION"

      # The digest beside each archive is what knvm, the bootstrap scripts, and
      # `self-update` verify a download against. An archive published without
      # one still installs — and reports itself as unverified — so this step is
      # what turns that warning off.
      - name: Publish a checksum beside each archive
        run: |
          cd dist
          for archive in *.tar.gz; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
            cat "$archive.sha256"
          done

      - name: Install from the packed archive and run the result
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi

          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/release/$KIRA_VERSION"
          cp "dist/kira-$KIRA_VERSION-${{ matrix.host_key }}.tar.gz" "$feed/release/$KIRA_VERSION/"

          home="$RUNNER_TEMP/kira-home"
          export KIRA_HOME="$home"
          export KNVM_RELEASE_DIR="$feed"
          "target/release/knvm$exe" install "$KIRA_VERSION"
          "target/release/knvm$exe" list

          program="$RUNNER_TEMP/program"
          mkdir -p "$program"
          printf 'import Foundation\n@Main function main() { printLine("release verified") return }\n' > "$program/main.kira"

          out="$("target/release/kira$exe" run "$program/main.kira")"
          echo "launcher said (vm): $out"
          [ "$out" = "release verified" ]

          # And the native engine, which is the half this step used to take on
          # faith. `kira run` proves the VM; a toolchain whose LLVM backend or
          # bridge archive is missing would have published anyway, and the
          # bridges are exactly what a Windows package got wrong. The managed
          # LLVM is already provisioned above, so the installed compiler links
          # against the same one this job built with.
          "target/release/kira$exe" build --backend llvm "$program/main.kira"
          native="$program/.kira-build/main$exe"
          [ -x "$native" ] || { echo "no native binary at $native" >&2; exit 1; }
          out="$("$native")"
          echo "the built binary said: $out"
          [ "$out" = "release verified" ]

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.host_key }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # knvm maps the GitHub prerelease flag to the `dev` channel.
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          generate_release_notes: true
