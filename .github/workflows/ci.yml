name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Makes `kira-llvm-backend`'s build script say which LLVM archives it asked
  # to link. A build script can see what it emitted and not what cargo did with
  # it, so when a link fails for want of symbols those archives define, this is
  # what says whether they were requested at all.
  KIRA_LLVM_LINK_TRACE: 1

jobs:
  check:
    name: fmt + clippy + build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # `emscripten` says whether the Emscripten SDK exists for the host, not
      # whether we want the Web pipeline: upstream publishes no Windows arm64
      # build, so `emsdk install` there resolves to an x86_64 package that is
      # not there. The day it ships one, this flag flips and nothing else here
      # changes.
      matrix:
        include:
          - os: ubuntu-24.04
            host_key: x86_64-linux-gnu
            emscripten: true
          - os: ubuntu-24.04-arm
            host_key: aarch64-linux-gnu
            emscripten: true
          - os: macos-latest
            host_key: aarch64-macos
            emscripten: true
          - os: windows-latest
            host_key: x86_64-windows-msvc
            emscripten: true
          - os: windows-11-arm
            host_key: aarch64-windows-msvc
            emscripten: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The managed LLVM bundle and the pinned libffi, both of which have to
      # exist before anything that links the compiler compiles. The Networking
      # workflow builds `kira-cli` too and needs exactly the same two, so the
      # provisioning is one composite action rather than a copy per workflow.
      - name: Provision the native toolchain
        uses: ./.github/actions/provision-native-toolchain
        with:
          host-key: ${{ matrix.host_key }}
          token: ${{ github.token }}

      # The shader validators. `crates/kira-cli/tests/shader_validation.rs`
      # puts every backend's output through the compiler that consumes it, and
      # fails rather than skipping when one of these is absent — a shader
      # nobody compiled is not a shader anybody checked.
      - name: Provision the shader validators
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install spirv-tools glslang
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # The Vulkan SDK, because it is the one Windows source that carries
            # both binaries the gate asks for — `glslangValidator` and
            # `spirv-val`. Chocolatey has no `glslang` or `spirv-tools` package
            # of its own (the first run here proved it: "not installed, the
            # package was not found"), and glslang's own release zip ships the
            # compiler without the SPIR-V validator.
            choco install --no-progress --yes vulkan-sdk
            # The SDK installs under a versioned directory, so its tools reach
            # the later steps by being put on PATH here rather than by being
            # anywhere predictable.
            sdk="$(ls -d /c/VulkanSDK/*/ 2>/dev/null | sort -V | tail -1)"
            if [ -z "$sdk" ]; then
              echo "the Vulkan SDK is not under C:/VulkanSDK after install" >&2
              exit 1
            fi
            cygpath -w "${sdk}Bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y spirv-tools glslang-tools
          fi
          cargo install naga-cli --locked

      # Apple's `metal` is a component of Xcode rather than part of it, and the
      # MSL case is compiled out on every other platform.
      - name: Provision the Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      # The Web pipeline: emcc links the modules the backend emits, node runs
      # them in the end-to-end tests, and the bridge crate cross-builds the
      # runtime archive those links consume.
      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.emscripten

      - name: Build the Web runtime archive
        if: matrix.emscripten
        run: |
          rustup target add wasm32-unknown-emscripten
          cargo build -p kira-native-bridge --target wasm32-unknown-emscripten

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # nextest runs the test binaries in parallel instead of one at a time,
      # and spawns no empty doc-test pass per crate — the workspace has no
      # doc-tests, and the stock runner pays for each of them anyway.
      - uses: taiki-e/install-action@nextest

      # A host with no Emscripten cannot run the tests that link with `emcc`
      # and execute under node, so they are excluded there by name. Excluding
      # them is the honest report; letting them fail would say the Web pipeline
      # is broken, and skipping the whole job would say this platform is
      # untested. Everything that does not need the toolchain still runs,
      # including the refusal that is decided before `emcc` is ever invoked.
      - name: cargo nextest
        shell: bash
        run: |
          if [ "${{ matrix.emscripten }}" = "true" ]; then
            cargo nextest run --workspace
          else
            cargo nextest run --workspace \
              -E 'not (test(/^web::/) or test(/^ffi_wasm::a_wasm_build_/))'
          fi
