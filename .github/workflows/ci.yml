name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host_key: x86_64-linux-gnu
          - os: macos-latest
            host_key: aarch64-macos
          # The third host the LLVM pin already names. `llvm-metadata.toml` has
          # carried `[target.x86_64-windows-msvc]` since the pin was written and
          # the bundle workflow builds it, so the platform was supported
          # everywhere except the gate that would have proved it.
          - os: windows-latest
            host_key: x86_64-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The LLVM backend is a hard dependency, and the backend's build script
      # discovers the bundle at the managed path itself — unpacking it there
      # is the whole setup; no environment variable is exported. The pin lives
      # in llvm-metadata.toml; the bundles are published by the llvm-bundles
      # workflow, once per pin.
      - name: Provision the managed LLVM
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' llvm-metadata.toml | head -1)"
          release="$(sed -n 's/^release_tag = "\(.*\)"/\1/p' llvm-metadata.toml | head -1)"
          # The asset name is read out of the metadata rather than spelled here.
          # That file says nothing invents asset names, and it means it: it
          # carries one archive format per host, and a name assembled from a
          # hardcoded `.tar.xz` is a second source of truth that the Windows
          # bundle — a `.zip` — contradicts on its first run.
          asset="$(awk -v section="[target.${{ matrix.host_key }}]" '
            $0 == section { inside = 1; next }
            /^\[/ { inside = 0 }
            inside && $1 == "asset" { gsub(/^[^"]*"|"$/, ""); print; exit }
          ' llvm-metadata.toml)"
          if [ -z "$asset" ]; then
            echo "llvm-metadata.toml names no asset for ${{ matrix.host_key }}" >&2
            exit 1
          fi
          home="$HOME/.kira/toolchains/llvm/$version/${{ matrix.host_key }}"
          mkdir -p "$home"
          case "$asset" in
            *.zip)
              gh release download "$release" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --output "$RUNNER_TEMP/llvm-bundle.zip"
              unzip -q "$RUNNER_TEMP/llvm-bundle.zip" -d "$home"
              ;;
            *)
              gh release download "$release" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --output - | tar -xJ -C "$home"
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}

      # The shader validators. `crates/kira-cli/tests/shader_validation.rs`
      # puts every backend's output through the compiler that consumes it, and
      # fails rather than skipping when one of these is absent — a shader
      # nobody compiled is not a shader anybody checked.
      - name: Provision the shader validators
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install spirv-tools glslang
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # The Vulkan SDK, because it is the one Windows source that carries
            # both binaries the gate asks for — `glslangValidator` and
            # `spirv-val`. Chocolatey has no `glslang` or `spirv-tools` package
            # of its own (the first run here proved it: "not installed, the
            # package was not found"), and glslang's own release zip ships the
            # compiler without the SPIR-V validator.
            choco install --no-progress --yes vulkan-sdk
            # The SDK installs under a versioned directory, so its tools reach
            # the later steps by being put on PATH here rather than by being
            # anywhere predictable.
            sdk="$(ls -d /c/VulkanSDK/*/ 2>/dev/null | sort -V | tail -1)"
            if [ -z "$sdk" ]; then
              echo "the Vulkan SDK is not under C:/VulkanSDK after install" >&2
              exit 1
            fi
            cygpath -w "${sdk}Bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y spirv-tools glslang-tools
          fi
          cargo install naga-cli --locked

      # Apple's `metal` is a component of Xcode rather than part of it, and the
      # MSL case is compiled out on every other platform.
      - name: Provision the Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      # The Web pipeline: emcc links the modules the backend emits, node runs
      # them in the end-to-end tests, and the bridge crate cross-builds the
      # runtime archive those links consume.
      - uses: mymindstorm/setup-emsdk@v14

      - name: Build the Web runtime archive
        run: |
          rustup target add wasm32-unknown-emscripten
          cargo build -p kira-native-bridge --target wasm32-unknown-emscripten

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # nextest runs the test binaries in parallel instead of one at a time,
      # and spawns no empty doc-test pass per crate — the workspace has no
      # doc-tests, and the stock runner pays for each of them anyway.
      - uses: taiki-e/install-action@nextest

      - name: cargo nextest
        run: cargo nextest run --workspace
