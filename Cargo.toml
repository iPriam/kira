[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.8.1"
edition = "2024"
license = "Apache-2.0 WITH LicenseRef-Kira-Runtime-Library-Exception"
license-file = "LICENSE"
repository = "https://github.com/kira-lang-com/kira"

[workspace.dependencies]
# Internal crates (path deps).
kira-core = { path = "crates/kira-core" }
kira-toolchain = { path = "crates/kira-toolchain" }
kira-source = { path = "crates/kira-source" }
kira-diagnostics = { path = "crates/kira-diagnostics" }
kira-diagnostic-messages = { path = "crates/kira-diagnostic-messages" }
kira-runtime-abi = { path = "crates/kira-runtime-abi" }
kira-syntax-model = { path = "crates/kira-syntax-model" }
kira-lexer = { path = "crates/kira-lexer" }
kira-parser = { path = "crates/kira-parser" }
kira-macros = { path = "crates/kira-macros" }
kira-ksl-syntax-model = { path = "crates/kira-ksl-syntax-model" }
kira-ksl-parser = { path = "crates/kira-ksl-parser" }
kira-semantics-model = { path = "crates/kira-semantics-model" }
kira-shader-model = { path = "crates/kira-shader-model" }
kira-ksl-semantics = { path = "crates/kira-ksl-semantics" }
kira-semantics = { path = "crates/kira-semantics" }
kira-ir = { path = "crates/kira-ir" }
kira-shader-ir = { path = "crates/kira-shader-ir" }
kira-hybrid-definition = { path = "crates/kira-hybrid-definition" }
kira-backend-api = { path = "crates/kira-backend-api" }
kira-native-lib-definition = { path = "crates/kira-native-lib-definition" }
kira-libffi = { path = "crates/kira-libffi" }
kira-dynamic-ffi = { path = "crates/kira-dynamic-ffi" }
kira-clang = { path = "crates/kira-clang" }
kira-glsl-backend = { path = "crates/kira-glsl-backend" }
kira-wgsl-backend = { path = "crates/kira-wgsl-backend" }
kira-hlsl-backend = { path = "crates/kira-hlsl-backend" }
kira-msl-backend = { path = "crates/kira-msl-backend" }
kira-spirv-backend = { path = "crates/kira-spirv-backend" }
kira-bytecode = { path = "crates/kira-bytecode" }
kira-vm-runtime = { path = "crates/kira-vm-runtime" }
kira-native-bridge = { path = "crates/kira-native-bridge" }
kira-compiler-bridge = { path = "crates/kira-compiler-bridge" }
kira-hybrid-runtime = { path = "crates/kira-hybrid-runtime" }
kira-debug = { path = "crates/kira-debug" }
kira-llvm-backend = { path = "crates/kira-llvm-backend" }
kira-manifest = { path = "crates/kira-manifest" }
kira-project = { path = "crates/kira-project" }
kira-package-manager = { path = "crates/kira-package-manager" }
kira-build-definition = { path = "crates/kira-build-definition" }
kira-program-graph = { path = "crates/kira-program-graph" }
kira-check = { path = "crates/kira-check" }
kira-build = { path = "crates/kira-build" }
kira-profile = { path = "crates/kira-profile" }
kira-linter = { path = "crates/kira-linter" }
kira-doc = { path = "crates/kira-doc" }
kira-app-generation = { path = "crates/kira-app-generation" }
kira-live = { path = "crates/kira-live" }
kira-desktop-runner = { path = "crates/kira-desktop-runner" }
kira-cli = { path = "crates/kira-cli" }
kira-main = { path = "crates/kira-main" }
kira-hybrid-main = { path = "crates/kira-hybrid-main" }
kira-launcher = { path = "crates/kira-launcher" }
kira-knvm = { path = "crates/kira-knvm" }
kira-devflow = { path = "crates/kira-devflow" }
kira-lsp = { path = "crates/kira-lsp" }
kira-mcp-protocol = { path = "crates/kira-mcp-protocol" }

# External dependencies.
thiserror = "2"
la-arena = "0.3"
bumpalo = "3"
libloading = "0.8"
libc = "0.2"
# Win32 declarations for the calls that have no portable name: the exclusive file
# lock a build directory is held with, and the suspend/unwind/symbolize calls the
# profiler's sampler is built from.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
redb = "4.1"
bytes = "1"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "http2", "tokio"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# LLVM/native backend: the raw LLVM-C API. Pinned to the LLVM 22.1 series that
# the managed toolchain ships (`llvm-sys` majors track the LLVM major.minor).
# A hard dependency of the backend: every workspace build needs a managed LLVM
# (LLVM_SYS_221_PREFIX names it; CI provisions the bundle before building).
llvm-sys = "221.0.1"
# LSP-first frontend: salsa incremental queries; lsp-server/lsp-types for
# the language server (rust-analyzer's stack).
salsa = "0.28"
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML is Kira's own metadata dialect (`llvm-metadata.toml`, and the package
# manifests the manifest crate will read), so the toolchain parses it with a
# real parser rather than ad-hoc string slicing.
toml = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Interpreter-hot packages are always built optimized, even in dev: a debug
# interpreter is 4-11x slower than an optimized one, and the dev snapshot is
# what `kira run` uses for interactive UI work.
[profile.dev.package.kira-vm-runtime]
opt-level = 3

[profile.dev.package.kira-bytecode]
opt-level = 3

# The runtime archive a native program links, for the same reason as the
# interpreter above: it is not tooling that runs once, it is the inner loop of
# every program the compiler produces. Unoptimized, `kira_rt_native_state_box_payload`
# and `kira_rt_*` raw-memory writes are a chain of un-inlined helpers, and a UI
# frame calls them per field and per vertex — measured on the native-4K liquid
# glass app, an unoptimized archive turned a 3 ms text-emission spike into 20 ms.
# `debug_assertions` still apply; only the inlining changes.
[profile.dev.package.kira-native-bridge]
opt-level = 3

[profile.dev.package.kira-runtime-abi]
opt-level = 3

