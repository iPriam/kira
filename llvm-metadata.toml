# The pinned LLVM toolchain: the contract between this repo, CI, and the
# downloader (`knvm install-llvm`). The downloader is knvm rather than kira
# because kira links the LLVM backend: a kira that provisioned LLVM would have
# to be built before the bundle it installs. knvm links none, so it builds from
# a bare checkout with `cargo run -p kira-knvm -- install-llvm`.
#
# This file is the single source of truth for which LLVM Kira expects, which
# release owns the published bundles, and the exact archive name per supported
# host. Nothing invents asset names: the release workflow reads this file, builds
# that target matrix, and must package archives whose names match `asset` here
# exactly. There is deliberately no checksum data — the version, release tag,
# target key, and asset name are the contract.
#
# `[llvm].version` is also the version the LLVM backend's `llvm-sys` bindings are
# built against. `llvm-sys` majors track LLVM `major.minor`, so LLVM 23.1.x pairs
# with `llvm-sys` 231.x: moving this pin means republishing the bundles *and*
# moving the `llvm-sys` dependency in the workspace `Cargo.toml`. A unit test in
# `kira-toolchain` fails if those two drift apart.

schema_version = 1

[llvm]
# A release candidate, deliberately. 23.1.0 has no final tag yet, and the
# generators the build below names are what a cross build needs, so the choice
# is between the newest series and waiting for it to be blessed. The version
# string carries `-rc3` rather than reading as `23.1.0`, because it is the
# install directory name, every asset name, and what a build reports when it says
# which LLVM it found: a bundle labelled 23.1.0 that is not 23.1.0 is the one
# thing this file exists to prevent. Moving to the final tag is these three lines
# plus the asset names, and it republishes the bundles.
version = "23.1.0-rc3"
source_tag = "llvmorg-23.1.0-rc3"
release_tag = "llvm-v23.1.0-rc3-kira.1"

[build]
build_type = "Release"
cmake_generator = "Ninja"
# Every published host's code generator, named outright rather than through
# CMake's `host`. A bundle built with `host` can emit only for the machine that
# built it, which makes cross compilation a property of *which runner produced
# your download* — an x86_64 Linux bundle could never emit an aarch64 binary,
# and the same `kira build --target aarch64-linux-gnu` would work or not
# depending on where the archive came from. Naming X86 and AArch64 makes every
# bundle able to emit for every machine Kira publishes for, so a target is a
# property of the compiler rather than of the download. WebAssembly is the Web
# device's code generator, emitted in-process by the same backend (never via
# textual IR).
#
# The cost is bundle size and LLVM build time, both of which are paid once per
# release by CI. `kira-toolchain`'s `llvm_code_generators` still expands a
# `host` entry, because a bundle installed before this pin changed carries
# fewer generators than the pin now names and has to be reported rather than
# assumed.
targets_to_build = "X86;AArch64;WebAssembly"

[target.x86_64-windows-msvc]
# Floating, because nothing about this image is a decision. MSVC guarantees
# compatibility forward only, so the toolset that builds a bundle would
# normally be the oldest Visual Studio that can link it, and every image update
# would raise that floor under developers who already installed a Visual
# Studio. `scripts/llvm/build-llvm.ps1` opts out of the STL's toolset-private
# helpers and `scripts/llvm/check-msvc-portability.ps1` fails the build if any
# survive, so the floor is a property of the artifact rather than of whichever
# toolset GitHub ships this month.
runner = "windows-latest"
platform = "windows"
archive = "zip"
asset = "llvm-23.1.0-rc3-x86_64-windows-msvc.zip"

[target.x86_64-linux-gnu]
runner = "ubuntu-24.04"
platform = "linux"
archive = "tar.xz"
asset = "llvm-23.1.0-rc3-x86_64-linux-gnu.tar.xz"

[target.aarch64-macos]
runner = "macos-14"
platform = "macos"
archive = "tar.xz"
asset = "llvm-23.1.0-rc3-aarch64-macos.tar.xz"
