# The pinned LLVM toolchain: the contract between this repo, CI, and the
# downloader (`knvm install-llvm`). The downloader is knvm rather than kira
# because kira links the LLVM backend: a kira that provisioned LLVM would have
# to be built before the bundle it installs. knvm links none, so it builds from
# a bare checkout with `cargo run -p kira-knvm -- install-llvm`.
#
# This file is the single source of truth for which LLVM Kira expects, which
# release owns the published bundles, and the exact archive name per supported
# host. Nothing invents asset names: the release workflow reads this file, builds
# that target matrix, and must package archives whose names match `asset` here
# exactly. There is deliberately no checksum data — the version, release tag,
# target key, and asset name are the contract.
#
# `[llvm].version` is also the version the LLVM backend's `llvm-sys` bindings are
# built against. `llvm-sys` majors track LLVM `major.minor`, so LLVM 22.1.x pairs
# with `llvm-sys` 221.x: moving this pin means republishing the bundles *and*
# moving the `llvm-sys` dependency in the workspace `Cargo.toml`. A unit test in
# `kira-toolchain` fails if those two drift apart.

schema_version = 1

[llvm]
version = "22.1.8"
source_tag = "llvmorg-22.1.8"
release_tag = "llvm-v22.1.8-kira.1"

[build]
build_type = "Release"
cmake_generator = "Ninja"
# `host` is the bundle's own machine; WebAssembly is the Web device's code
# generator, emitted in-process by the same backend (never via textual IR).
targets_to_build = "host;WebAssembly"

[target.x86_64-windows-msvc]
# Floating, because nothing about this image is a decision. MSVC guarantees
# compatibility forward only, so the toolset that builds a bundle would
# normally be the oldest Visual Studio that can link it, and every image update
# would raise that floor under developers who already installed a Visual
# Studio. `scripts/llvm/build-llvm.ps1` opts out of the STL's toolset-private
# helpers and `scripts/llvm/check-msvc-portability.ps1` fails the build if any
# survive, so the floor is a property of the artifact rather than of whichever
# toolset GitHub ships this month.
runner = "windows-latest"
platform = "windows"
archive = "zip"
asset = "llvm-22.1.8-x86_64-windows-msvc.zip"

[target.x86_64-linux-gnu]
runner = "ubuntu-24.04"
platform = "linux"
archive = "tar.xz"
asset = "llvm-22.1.8-x86_64-linux-gnu.tar.xz"

[target.aarch64-macos]
runner = "macos-14"
platform = "macos"
archive = "tar.xz"
asset = "llvm-22.1.8-aarch64-macos.tar.xz"
