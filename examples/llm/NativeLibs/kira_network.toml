name = "kira_network"

# Build the workspace crate first:
#     cargo build -p kira-network
# Paths are relative to this manifest.
#
# Every row names the same host-default archive on purpose. This example is
# built and run for the machine it is on — `.github/workflows/ci.yml` builds the
# crate with a plain `cargo build -p kira-network` and then runs this package on
# each runner — so the row that matches is always the host's, and the archive
# cargo just wrote is always the right one for it.
#
# A per-target path such as `target/aarch64-apple-darwin/debug/` would be more
# obviously correct and would break every one of those runs, because nothing
# here passes `--target` and cargo writes a host build to `target/debug`. Add
# the per-target paths when something cross-compiles a Kira program against this
# library; until then they would name files no build produces.

[[target]]
triple = "x86_64-windows-msvc"
staticLib = "../../../target/debug/kira_network.lib"

[[target]]
triple = "x86_64-linux-gnu"
staticLib = "../../../target/debug/libkira_network.a"

[[target]]
triple = "aarch64-linux-gnu"
staticLib = "../../../target/debug/libkira_network.a"

[[target]]
triple = "x86_64-macos-none"
staticLib = "../../../target/debug/libkira_network.a"

[[target]]
triple = "aarch64-macos-none"
staticLib = "../../../target/debug/libkira_network.a"
