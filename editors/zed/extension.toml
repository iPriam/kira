id = "kira"
name = "Kira"
version = "0.2.0"
schema_version = 1
authors = ["Kira"]
description = "Kira language support for Zed: syntax highlighting and language features from the Kira language server."
repository = "https://github.com/kira-lang-com/kira-zed-extension"
languages = ["languages/kira"]
themes = []
icon_themes = []
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

# The grammar lives in the Kira monorepo. Keep this at a commit reachable from
# its main branch so marketplace installs never depend on a developer's disk.
[grammars.kira]
repository = "https://github.com/kira-lang-com/kira"
rev = "ab303e96b5c5da17070c875a1594d38f505b0ddf"
path = "editors/tree-sitter"

# `languages` must match the `name` in languages/kira/config.toml exactly.
[language_servers.kira-lsp]
name = "Kira Language Server"
languages = ["Kira"]
